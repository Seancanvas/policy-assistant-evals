[project]
name = "policy-assistant-evals"
version = "0.1.0"
description = "A small policy assistant on the OpenAI Responses API, with retrieval, one read-only tool and an eval suite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.6",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
